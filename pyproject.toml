[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdecrypt"
version = "0.1.0"
description = "Lokale Wiederherstellung passwortgeschützter Word-Dateien"
requires-python = ">=3.10"
dependencies = ["msoffcrypto-tool>=5.4,<6", "olefile>=0.47,<1"]

[project.scripts]
docdecrypt = "docdecrypt.cli:main"

[tool.setuptools.packages.find]
include = ["docdecrypt*"]

[tool.setuptools.package-data]
docdecrypt = ["rules/*.rule"]
